[pytest]
testpaths = tests
markers =
    api: testes da API REST do ServeRest
    web: testes de interface (end-to-end) do front-end do ServeRest
addopts =
    -v
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
    --html=reports/relatorio.html
    --self-contained-html
